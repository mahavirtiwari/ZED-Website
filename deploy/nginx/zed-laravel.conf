# nginx server block for the Laravel version of the ZED website (public site + /cms).
# Replaces deploy/nginx/zed.conf at the switch-over (see Code/zed-laravel/README-ZED.md).
#
# Layout on the server (example):
#   /var/www/zed-laravel            the Laravel app (Code/zed-laravel)
#   /var/www/zed-laravel/public     web root; assets/, uploads/, photogallery/, slider/ live here
#
# Adjust server_name, paths, certificates and the PHP-FPM socket, then:
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name zed.msme.gov.in;
    location /.well-known/acme-challenge/ { root /var/www/zed-laravel/public; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zed.msme.gov.in;

    root  /var/www/zed-laravel/public;
    index index.php;

    ssl_certificate     /etc/ssl/zed/fullchain.pem;
    ssl_certificate_key /etc/ssl/zed/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    client_max_body_size 32m;
    autoindex off;
    charset utf-8;

    # security headers for files nginx serves itself (Laravel sends its own, with the CSP)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ^~ /.well-known/ { allow all; }
    location ~ /\. { return 404; }                                   # dot-files
    location ~* \.(sql|log|md|rst|bak|old|orig|swp|dist|cnf|ini|env)$ { return 404; }

    # uploaded files: never run scripts
    location ~* ^/(uploads|photogallery|slider)/.*\.(php\d?|phtml|phar|pl|py|cgi|sh|shtml)$ { return 404; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # only the front controller runs PHP
    location = /index.php {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_hide_header X-Powered-By;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        # Laravel sends the other security headers; this stops nginx adding them twice
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    location ~ \.php$ { return 404; }

    location ~* \.(css|js|png|jpe?g|gif|svg|webp|ico|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
}

# Firewall: only 80/443 public; SSH from office/VPN IPs; MySQL on 127.0.0.1 only.
