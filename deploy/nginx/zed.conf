# nginx server block for the ZED website (public site + /cms).
#
# Audit fixes this covers (Verification No. I, 09-10-2026):
#   - Sensitive File Disclosure: .DS_Store / .htaccess / application/ were served,
#     because nginx ignores .htaccess files. The deny rules below replace them.
#   - Lack of Security Headers: headers for static files (PHP pages send their own,
#     including the nonce-based Content-Security-Policy, from MY_Output).
#   - Open Ports: see the firewall notes at the end.
#
# Adjust server_name, root, certificate paths and the PHP-FPM socket, then:
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name zed.msme.gov.in;
    # HTTPS only (the password-encryption script also needs a secure page)
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zed.msme.gov.in;

    root  /var/www/html;          # = Code/zedcms
    index index.php;

    ssl_certificate     /etc/ssl/zed/fullchain.pem;
    ssl_certificate_key /etc/ssl/zed/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    server_tokens off;            # no nginx version in headers or error pages
    client_max_body_size 32m;
    autoindex off;

    # --- security headers for everything nginx serves itself -------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- never serve these (answer 404 so their existence is not revealed) ---
    location ^~ /.well-known/ { allow all; }
    location ~ /\.            { return 404; }   # .htaccess, .DS_Store, .git, .env ...
    location ~ ^/(cms/)?(application|system)(/|$) { return 404; }
    location ~ ^/phpmailer(/|$) { return 404; }
    location ~* \.(sql|log|md|rst|bak|old|orig|swp|dist|cnf|ini)$ { return 404; }
    location ~* ^/composer\.(json|lock)$ { return 404; }

    # --- upload folders: files only, never run scripts --------------------
    location ~* ^/(cms/)?(uploads|photogallery|slider)/.*\.(php\d?|phtml|phar|pl|py|cgi|sh|shtml)$ { return 404; }

    # --- CMS ----------------------------------------------------------------
    location /cms/ {
        try_files $uri $uri/ /cms/index.php?$args;
    }

    # --- public site --------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # --- PHP: only the two front controllers ----------------------------
    location ~ ^/(cms/)?index\.php(/|$) {
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param CI_ENV production;
        fastcgi_hide_header X-Powered-By;
        # PHP sends the other security headers (and the CSP) itself; an add_header
        # here stops the server-level ones from being added a second time
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }
    # any other .php file is not an entry point
    location ~ \.php$ { return 404; }

    # long cache for static assets
    location ~* \.(css|js|png|jpe?g|gif|svg|webp|ico|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri =404;
    }
}

# --- Open Ports (audit item 3) -------------------------------------------
# Expose only 80 and 443 to the internet. Example with ufw:
#   sudo ufw default deny incoming
#   sudo ufw allow 80/tcp
#   sudo ufw allow 443/tcp
#   sudo ufw allow from <office/VPN IP> to any port 22 proto tcp
#   sudo ufw enable
# MySQL must listen on 127.0.0.1 only (bind-address = 127.0.0.1 in mysqld.cnf),
# and PHP-FPM on a unix socket, not a TCP port.
